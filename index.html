<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e121b">
<title>Lift Together</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div class="brand">💪 Lift Together</div>
    <div id="who"></div>
  </header>
  <div id="demoBanner" hidden>Demo mode: sample data, saved only in this browser. Connect Supabase in <code>config.js</code> to go live.</div>
  <main id="view"><p class="muted center" style="margin-top:40px">Loading…</p></main>
  <nav id="nav" hidden>
    <button data-tab="log"><span>➕</span>Log</button>
    <button data-tab="history"><span>📅</span>History</button>
    <button data-tab="progress"><span>📈</span>Progress</button>
    <button data-tab="body"><span>⚖️</span>Body</button>
    <button data-tab="compete"><span>🏆</span>Compete</button>
  </nav>
  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
